# CI pipeline (docs/CI_CD.md): lint -> type-check -> unit tests -> build.
# Security checks, integration tests, Docker build, and deploy stages are
# added in Phase 15 once there is a real staging target to deploy to.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/test.txt
      - run: pip install -r requirements/test.txt
      - run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: pytest -q
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
