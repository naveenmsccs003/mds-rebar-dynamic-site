# Full pipeline (docs/CI_CD.md):
#   lint -> type check -> unit tests -> security checks -> build
#        -> integration tests -> E2E -> docker build -> staging deploy
#        -> smoke tests -> production approval (manual) -> production deploy
#
# A broken build never reaches main: mark `backend`, `frontend`,
# `integration` and `e2e` as required status checks on the `main` branch
# protection rule.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ghcr.io

jobs:
  # ---------- lint + unit tests ----------
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/test.txt
      - run: pip install -r requirements/test.txt
      - name: Lint + static analysis
        run: |
          ruff check .
          bandit -c pyproject.toml -r apps config -q
      - name: Dependency audit (advisory)
        run: pip-audit -r requirements/base.txt -r requirements/test.txt
        continue-on-error: true
      - run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - run: pytest -q
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test          # vitest (tsc -b runs inside `build`)
      - run: npm run build         # tsc -b + vite build + `npm audit` below
      - run: npm audit --omit=dev --audit-level=high
        continue-on-error: true

  # ---------- integration tests against real services ----------
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mds_rebar
          POSTGRES_USER: mds_rebar
          POSTGRES_PASSWORD: mds_rebar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mds_rebar" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/test.txt
      - run: pip install -r requirements/test.txt
      - name: Migrate + run the suite on PostgreSQL
        run: |
          python manage.py migrate --noinput
          pytest -q
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci
          DATABASE_URL: postgres://mds_rebar:mds_rebar@localhost:5432/mds_rebar
          REDIS_URL: redis://localhost:6379/1

  # ---------- backup / restore drill (docs/BACKUP_DISASTER_RECOVERY.md) ----------
  backup-drill:
    runs-on: ubuntu-latest
    needs: [integration]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: mds_rebar
          POSTGRES_USER: mds_rebar
          POSTGRES_PASSWORD: mds_rebar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mds_rebar" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements/test.txt
      - run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          pip install -r requirements/test.txt
      - name: Seed a schema, then dump -> fresh DB -> restore -> verify
        run: |
          python manage.py migrate --noinput
          python manage.py sync_roles
          bash scripts/restore_drill.sh
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci
          DATABASE_URL: postgres://mds_rebar:mds_rebar@localhost:5432/mds_rebar
          REDIS_URL: redis://localhost:6379/1

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ---------- images (built on every run, pushed only from main) ----------
  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend, integration, backup-drill, e2e]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          target: prod
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: prod
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- staging: automatic on main ----------
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main'
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Deploy the SHA-tagged images to staging
        run: |
          echo "Promote ghcr.io/${{ github.repository }}/{backend,frontend}:${{ github.sha }} to staging."
          echo "Wire this to the platform (kubectl set image / render deploy / fly deploy / ECS update-service)."
          echo "The deploy step must run 'manage.py migrate --noinput' before cutting traffic over."
      - name: Smoke test staging (docs/CI_CD.md)
        if: ${{ vars.STAGING_URL != '' }}
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test e2e/smoke.spec.ts
        env:
          SMOKE_BASE_URL: ${{ vars.STAGING_URL }}

  # ---------- production: manual approval, promote the same artifact ----------
  deploy-production:
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production      # add required reviewers here = the manual gate
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Promote the exact staging artifact
        run: |
          echo "Promote ghcr.io/${{ github.repository }}/{backend,frontend}:${{ github.sha }} to production."
          echo "Same image digest that passed staging + smoke tests — never a rebuild."
