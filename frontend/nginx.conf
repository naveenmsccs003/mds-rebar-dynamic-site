# Serves the built SPA. History-API fallback so client routes resolve;
# long-cache the fingerprinted assets, never the HTML shell. The API is
# a separate origin (docs/DEPLOYMENT.md) — nginx here does not proxy it.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed assets — immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA routes.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The frontend host serves its own CSP (docs/SECURITY.md — the Django
    # middleware only covers the API/admin surface).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
