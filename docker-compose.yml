# Local development only. Staging/production use managed Postgres/Redis/
# object storage and the `prod`-target images built by CI
# (docs/DEPLOYMENT.md, docs/CI_CD.md) — this file is not a production
# deployment manifest.

x-backend-env: &backend-env
  DJANGO_SETTINGS_MODULE: config.settings.dev
  DATABASE_URL: postgres://mds_rebar:mds_rebar@postgres:5432/mds_rebar
  REDIS_URL: redis://redis:6379/0

x-backend-build: &backend-build
  build:
    context: ./backend
    target: dev
  env_file: ./backend/.env
  volumes:
    - ./backend:/app
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mds_rebar
      POSTGRES_USER: mds_rebar
      POSTGRES_PASSWORD: mds_rebar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mds_rebar"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    <<: *backend-build
    command: python manage.py runserver 0.0.0.0:8000
    environment: *backend-env
    ports:
      - "8000:8000"

  worker:
    <<: *backend-build
    command: celery -A config worker -l info
    environment: *backend-env

  scheduler:
    <<: *backend-build
    command: celery -A config beat -l info
    environment: *backend-env

  frontend:
    build:
      context: ./frontend
      target: dev
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000/api/v1

volumes:
  postgres_data:
